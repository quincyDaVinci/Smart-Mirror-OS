name: Verify Smart Mirror
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Lint updated admin page
        run: npx eslint src/pages/AdminPage.tsx
      - name: Check backend syntax
        run: node --check server/index.js
      - name: Check trivia provider syntax
        run: node --check server/providers/jellyfinTrivia.js
      - name: Run media backend tests
        run: |
          node --test \
            server/mediaPriority.test.js \
            server/spotifyPauseTimeout.test.js \
            server/dunePauseTimeout.test.js \
            server/duneJellyfinProgress.test.js \
            server/providers/duneNowPlaying.test.js \
            server/providers/youtubeNowPlaying.test.js \
            server/youtubeHeartbeatRequest.test.js
